[tool.setuptools]
packages = ["analysis_utils"]

[project]
name = "analysis_utils"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "plotly>=5.15",
    "orjson>=3.9",
    "kaleido>=0.2.1",
    "jupyter>=1.0",
    "scipy>=1.17.0",
    "pyarrow>=23.0.0",
    "scikit-posthocs>=0.11.4",
    "tabulate>=0.10.0",
    "markdown (>=3.10.2,<4.0.0)",
    "nbstripout (==0.9.1)",
    "datacompy>=1.0.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "nbconvert>=7.17.1",
]

[project.optional-dependencies]
dev = ["pipreqs"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
